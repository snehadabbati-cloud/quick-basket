<!DOCTYPE html>
<html>
<head>
  <!--
    Quick Basket - 10-Minute Grocery Delivery
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quick Basket - 10-Minute Grocery Delivery. Superfast delivery of fresh fruits, vegetables, dairy, snacks, and daily essentials.">
  <meta name="theme-color" content="#0C8340">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Disable caching during development so browser refreshes immediately load latest code -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Basket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quick Basket - 10-Minute Grocery Delivery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      overflow: hidden;
    }
  </style>

  <script>
    // Unregister any active service workers on localhost to ensure fresh code on refresh
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    // Clear browser cache storage
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
</head>
<body>
  <script>
    // Load flutter_bootstrap.js with a timestamp query param to bust browser cache
    var s = document.createElement('script');
    s.src = 'flutter_bootstrap.js?v=' + Date.now();
    s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
